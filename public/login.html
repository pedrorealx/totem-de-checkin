<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Totem de Check-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16233E;
    --ink-soft: #4B5871;
    --paper: #FAFBFC;
    --backdrop: #C7CDD4;
    --accent: #0F5C5C;
    --accent-dark: #0C4747;
    --error: #B3261E;
    --error-bg: #FBEAE9;
    --border: #E3E6EA;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    background: var(--backdrop);
    background-image:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,0.35), transparent 40%),
      radial-gradient(circle at 80% 85%, rgba(255,255,255,0.25), transparent 45%);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    width: 100%;
    max-width: 360px;
    background: var(--paper);
    border-radius: 20px;
    padding: 34px 30px 30px;
    box-shadow: 0 30px 60px rgba(15, 23, 42, 0.2), 0 4px 12px rgba(15, 23, 42, 0.12);
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 22px;
    margin: 0 0 6px;
  }

  p.sub {
    margin: 0 0 26px;
    font-size: 13.5px;
    color: var(--ink-soft);
    line-height: 1.5;
  }

  label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    margin: 0 0 6px;
  }

  .field { margin-bottom: 16px; }

  input {
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: #fff;
    color: var(--ink);
  }

  input:focus {
    outline: none;
    border-color: var(--accent);
  }

  button {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    padding: 13px 0;
    cursor: pointer;
    margin-top: 6px;
    transition: background 0.15s ease, opacity 0.15s ease;
  }

  button:hover:not(:disabled) { background: var(--accent-dark); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }

  .erro {
    display: none;
    background: var(--error-bg);
    color: var(--error);
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 16px;
    line-height: 1.4;
  }

  .erro.active { display: block; }

  .rodape {
    margin-top: 20px;
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
  }
</style>
</head>
<body>

<div class="card">
  <h1>Totem de Check-in</h1>
  <p class="sub">Entre com seu usuário para acessar a área de administração ou o totem de confirmação de presença.</p>

  <div class="erro" id="erroMsg"></div>

  <form id="loginForm">
    <div class="field">
      <label for="usuario">Usuário</label>
      <input type="text" id="usuario" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="senha">Senha</label>
      <input type="password" id="senha" autocomplete="current-password" minlength="6" maxlength="72" required>
    </div>
    <button type="submit" id="entrarBtn">Entrar</button>
  </form>

  <div class="rodape">Acesso restrito à equipe do evento.</div>
</div>

<script>
  const form = document.getElementById('loginForm');
  const erroMsg = document.getElementById('erroMsg');
  const entrarBtn = document.getElementById('entrarBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    erroMsg.classList.remove('active');
    entrarBtn.disabled = true;
    entrarBtn.textContent = 'Entrando...';

    const usuario = document.getElementById('usuario').value.trim();
    const senha = document.getElementById('senha').value;

    try {
      const resp = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usuario, senha }),
      });
      const data = await resp.json();

      if (!resp.ok) {
        erroMsg.textContent = data.mensagem || 'Não foi possível entrar.';
        erroMsg.classList.add('active');
        entrarBtn.disabled = false;
        entrarBtn.textContent = 'Entrar';
        return;
      }

      window.location.href = data.redirecionar || '/login.html';
    } catch (err) {
      erroMsg.textContent = 'Não foi possível conectar ao servidor.';
      erroMsg.classList.add('active');
      entrarBtn.disabled = false;
      entrarBtn.textContent = 'Entrar';
    }
  });
</script>

</body>
</html>
